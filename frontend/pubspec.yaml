name: football_tactics_app
description: "Minimalist Football Analytics SPA for tacticians and analysts"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # BLoC State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hydrated_bloc: ^9.1.2
  dio: ^5.4.0
  shared_preferences: ^2.0.0
  intl: ^0.19.0
  http: ^0.13.0

  # UI Components
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets for country flags
  assets:
    - assets/flags/

  # Fonts - using default Material fonts