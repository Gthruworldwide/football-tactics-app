services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_HOST: redis
      MCP_BASE_URL: http://mcp_server:8001
      DB_PATH: /app/data/tactics_analytics.db
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  mcp_server:
    build: ./mcp_server
    ports:
      - "8001:8001"
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LANGFLOW_BASE_URL: ${LANGFLOW_BASE_URL:-http://host.docker.internal:7860}
      LANGFLOW_API_KEY: ${LANGFLOW_API_KEY:-}
      LANGFLOW_FLOW_ID: ${LANGFLOW_FLOW_ID:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
      CORS_ORIGINS: "*"

  # Optional: docker compose --profile tunnel up   (needs CLOUDFLARE_TUNNEL_TOKEN in .env)
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    restart: unless-stopped
